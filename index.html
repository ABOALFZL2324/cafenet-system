<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مدیریت کافی‌نت | CafeNet Manager</title>
    <!-- اسکریپت ضد فلش سفیدی در دارک مود (Anti-White Flash Script) -->
    <script>
      (function() {
        try {
          var isDark = localStorage.getItem('cafenet_dark_mode') === 'true';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#1e1e1e';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f3f3f3';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f3f3f3] dark:bg-[#1e1e1e] text-slate-800 dark:text-slate-100 font-sans select-none antialiased overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
